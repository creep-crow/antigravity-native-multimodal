name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Check for hardcoded personal paths
        shell: bash
        run: |
          if grep -rnE 'yzh13|D:\\ffmpeg|C:\\Users\\' plugin.json hooks.json rules/ skills/ hooks/ scripts/ tests/ README*.md; then
            echo "Found hardcoded personal path!"
            exit 1
          fi

      - name: Run hook unit and shell integration tests
        run: python -X utf8 -m unittest discover -s hooks -p "test_*.py" -v

      - name: Run media preparation skill tests
        run: python -X utf8 -m unittest discover -s tests -p "test_*.py" -v
